name: CI

on:
  pull_request:
  push:
    branches: [main, Kireeti]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  trade-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meraki
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trade_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meraki -d trade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRADE_TEST_DATABASE_URL: postgresql+psycopg://meraki:ci-only-password@127.0.0.1:5432/trade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: python scripts/build_agricultural_data.py --check
      - run: python -m model_validation --check
      - run: python -m pytest server/tests tests -q

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meraki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meraki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pytest server/tests -q
      - run: python -m pytest server/tests/test_shared_backend.py::test_postgresql_concurrent_reservations_do_not_oversell -q
        env:
          MERAKI_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/meraki_test
